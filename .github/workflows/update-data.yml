name: Update data

on:
  schedule:
    # Runs at 8:00 AM EST (Nov to Mar) - shifted to 15 mins past the hour to avoid queue congestion
    - cron: "00 09 * * 1-5"
      timezone: "America/New_York"
    # Runs at 8:00 AM EDT (Mar to Nov)
   # - cron: "00 08 * * 1-5"
    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: update-data-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

  
      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev
          sudo apt-get install -y libquantlib0-dev \
            || sudo apt-get install -y libquantlib-dev \
            || sudo apt-get install -y libquantlib0v5 libquantlib0v5-dev

      - name: Install dependencies
        run: |
          install.packages(c("gt","readr","gridExtra","tidyquant","xts","quantmod","tsbox","xts","dbplyr","RQuantLib","shinyWidgets","ggplot2", "jsonlite", "dplyr", "stringr", "lubridate", "derivmkts","pbapply","httr","rvest","purrr","data.table","quantmod","ggalt","clipr","scales"))
        shell: Rscript {0}

      - name: Update data
        run: |
          source("update_data.R")
        shell: Rscript {0}
  
      - name: Commit files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin main
          git pull origin main --no-edit || true
          git add --all
          git commit -m "add data" || echo "No changes to commit"
          git push origin main
